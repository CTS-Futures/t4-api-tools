syntax = "proto3";
package t4proto.v2.market;

import "google/protobuf/timestamp.proto";
import "t4/v2/common/enums.proto";
import "t4/v2/common/price.proto";

// Subscribes to, or unsubscribes from, market data for a single market.
message MarketSubscribe {
  string exchange_id = 1;
  string contract_id = 2;
  string market_id = 3;
  // How much order-book detail to stream; NONE to unsubscribe.
  t4proto.v2.common.Quotes quotes = 4;
  // When true, also stream trade prints as MarketTrade messages.
  bool ticker = 5;
}

// Sent when a MarketSubscribe cannot be satisfied (e.g. unknown market or no
// market-data permission). mode carries the reason.
message MarketSubscribeReject {
  string market_id = 1;
  google.protobuf.Timestamp time = 2;
  t4proto.v2.common.MarketMode mode = 3;
}

// Full definition of a tradable instrument. Delivered on subscribe and when the
// definition changes. Prices/volumes elsewhere are interpreted using these fields.
message MarketDetails {
  string market_id = 1;
  string exchange_id = 2;
  string contract_id = 3;
  int32 expiry_date = 4;
  t4proto.v2.common.ContractType contract_type = 5;
  int32 decimals = 6;                                    // Price decimal places (decimal format).
  t4proto.v2.common.Decimal point_value = 7;             // Cash value of one full price point.
  t4proto.v2.common.Price min_price_increment = 8;       // Tick size (smallest price step).
  int32 order_types = 9;
  google.protobuf.Timestamp activation_date = 10;
  google.protobuf.Timestamp last_trading_date = 11;
  google.protobuf.Timestamp last_client_update_time = 12;
  int64 delist_date = 13;
  int64 exchange_delist_date = 14;
  string market_ref = 15;
  string group = 16;

  repeated LegItem legs = 17;                            // Component legs, for spreads/strategies.

  string details = 18;
  t4proto.v2.common.StrategyType strategy_type = 19;
  string price_code = 20;
  int32 real_decimals = 21;                              // Price decimal places (real format).
  int32 display_decimals = 22;                           // Price decimal places (display).
  int32 clearing_decimals = 23;                          // Price decimal places (clearing format).
  optional t4proto.v2.common.Price min_cab_price = 24;   // Minimum cabinet price (options).
  optional t4proto.v2.common.Price strike_price = 25;    // Option strike.
  int32 volume_increment = 26;                           // Smallest tradable volume step.
  double strategy_ratio = 27;
  bool disabled = 28;                                    // True when the market is not tradable.
  string underlying_market_id = 29;                      // Underlying instrument (options/derived).
  string vtt = 30;
  double maint_intra_margin = 31;
  double maint_margin = 32;
  double maint_vol_scan = 33;

  // One leg of a spread/strategy instrument.
  message LegItem {
    string market_id = 1;
    int32 group = 2;
    int32 volume = 3;   // Leg ratio (contracts of this leg per unit of the strategy).
    string delta = 4;
    t4proto.v2.common.Price price = 5;
  }
}


// Price feed for a market: the full state on subscribe, then incremental updates.
// bids/offers are outright levels; implied_* are levels implied from related spreads.
message MarketDepth {
  string market_id = 1;
  t4proto.v2.common.DepthLevels depth_levels = 2;
  t4proto.v2.common.DepthBuffer depth_buffer = 3;
  google.protobuf.Timestamp time = 4;
  bool delayed = 5;                          // True when the data is delayed, not real-time.
  repeated DepthLine bids = 6;
  repeated DepthLine offers = 7;
  repeated DepthLine implied_bids = 8;
  repeated DepthLine implied_offers = 9;
  t4proto.v2.common.MarketMode mode = 10;    // Trading state (open, closed, halted, ...).
  t4proto.v2.common.MarketFlags2 flags = 11;

  TradeData trade_data = 12;                 // Latest trade summary, when included.

  // One price level: the price, total volume there, and how many orders make it up.
  message DepthLine {
    t4proto.v2.common.Price price = 1;
    int32 volume = 2;
    int32 num_orders = 3;
  }

  // Rolling summary of the most recent trade(s) in the market.
  message TradeData {
    int32 total_traded_volume = 1;
    int32 total_trade_count = 2;
    t4proto.v2.common.Price last_trade_price = 3;
    int32 last_trade_volume = 4;
    int32 last_trade_total_volume = 5;
    t4proto.v2.common.Price last_trade_spd_price = 6;
    int32 last_trade_spd_volume = 7;
    int32 last_trade_spd_total_volume = 8;
    bool due_to_spread = 9;
    t4proto.v2.common.BidOffer at_bid_or_offer = 10;
    google.protobuf.Timestamp time = 11;
  }
}

// A trade print for a subscribed market, streamed when the subscription
// enabled the trade ticker (MarketSubscribe.ticker).
message MarketTrade {
  string market_id = 1;
  google.protobuf.Timestamp time = 2;
  t4proto.v2.common.Price last_trade_price = 3;
  int32 last_trade_volume = 4;
  int32 total_traded_volume = 5;
  int32 total_trade_count = 6;
  bool due_to_spread = 7;
  t4proto.v2.common.BidOffer aggressor_side = 8;
  bool delayed = 9;
  t4proto.v2.common.MarketMode mode = 10;

  // Feed sequence number for the trade. Set only for MARKET_BY_ORDER subscriptions.
  uint64 sequence = 11;
  // The resting orders that took part in the trade. Set only for MARKET_BY_ORDER subscriptions.
  repeated OrderDetail orders = 12;

  message OrderDetail {
    uint64 order_id = 1;
    int32 volume = 2;
    t4proto.v2.common.BidOffer bid_offer = 3;
  }
}

// Session open, high and low prices for the trade date.
message MarketHighLow {
  string market_id = 1;
  t4proto.v2.common.Price open_price = 2;
  t4proto.v2.common.Price high_price = 3;
  t4proto.v2.common.Price low_price = 4;
  int64 trade_date = 5;
  google.protobuf.Timestamp time = 6;
  bool delayed = 7;
}

// Exchange price limits (the highest/lowest price currently allowed to trade).
message MarketPriceLimits {
  string market_id = 1;
  t4proto.v2.common.Price high_price = 2;
  t4proto.v2.common.Price low_price = 3;
  google.protobuf.Timestamp time = 4;
  bool delayed = 5;
}

// Settlement price plus open interest, cleared volume and VWAP for the market.
// "held" values are provisional figures published before the final ones.
message MarketSettlement {
  string exchange_id = 1;
  string market_id = 2;
  bool delayed = 3;
  t4proto.v2.common.Price settlement_price = 4;
  google.protobuf.Timestamp settlement_time = 5;
  google.protobuf.Timestamp settlement_trade_date = 6;
  t4proto.v2.common.Price settlement_held_price = 7;
  google.protobuf.Timestamp settlement_held_time = 8;
  google.protobuf.Timestamp settlement_held_trade_date = 9;
  t4proto.v2.common.Price implied_price = 10;
  t4proto.v2.common.Price implied_held_price = 11;
  google.protobuf.Timestamp implied_time = 12;
  int32 open_interest = 13;
  google.protobuf.Timestamp open_interest_time = 14;
  google.protobuf.Timestamp open_interest_trade_date = 15;
  int32 cleared_volume = 16;
  google.protobuf.Timestamp cleared_volume_time = 17;
  google.protobuf.Timestamp cleared_volume_trade_date = 18;
  t4proto.v2.common.Price vwap_price = 19;
  google.protobuf.Timestamp vwap_time = 20;
  google.protobuf.Timestamp vwap_trade_date = 21;
}

// One entry in a MarketSnapshot bundle.
message MarketSnapshotMessage {
    oneof payload {
        MarketDepth market_depth = 3;
        MarketTrade market_trade = 4;
        MarketHighLow market_high_low = 5;
        MarketPriceLimits market_price_limits = 6;
        MarketSettlement market_settlement = 7;
    }
}

// Full current state of a market, sent on subscribe as a bundle of the messages above.
// due_to_connection is true when the snapshot was resent after a connection recovery.
message MarketSnapshot {
    string market_id = 1;
    t4proto.v2.common.MarketMode mode = 2;
    bool due_to_connection = 3;
    bool delayed = 4;
    repeated MarketSnapshotMessage messages = 5;
}


// Full order-by-order book on subscribe (quotes = MARKET_BY_ORDER): every resting order.
// Track last_sequence and apply MarketByOrderUpdate messages from there.
message MarketByOrderSnapshot {
  string market_id = 1;
  google.protobuf.Timestamp time = 2;
  t4proto.v2.common.MarketMode mode = 3;
  uint64 last_sequence = 4;
  repeated Order orders = 5;

  message Order {
    uint64 order_id = 1;
    t4proto.v2.common.BidOffer bid_offer = 2;
    t4proto.v2.common.Price price = 3;
    int32 volume = 4;
    uint64 priority = 5;   // Queue position (lower = ahead).
  }
}

// Incremental order-by-order changes. Apply updates in sequence order; if you detect
// a gap in sequence, resubscribe to get a fresh snapshot.
message MarketByOrderUpdate {
  string market_id = 1;
  google.protobuf.Timestamp time = 2;
  t4proto.v2.common.MarketMode mode = 3;
  uint64 sequence = 4;
  repeated Update updates = 5;

  enum UpdateType {
    UPDATE_TYPE_ADD_OR_UPDATE = 0;   // Order added or its volume/price changed.
    UPDATE_TYPE_DELETE = 1;          // Order removed (filled or pulled).
    UPDATE_TYPE_CLEAR = 2;           // Drop all orders and rebuild from here.
  }

  message Update {
    UpdateType update_type = 1;
    uint64 order_id = 2;
    t4proto.v2.common.BidOffer bid_offer = 3;
    t4proto.v2.common.Price price = 4;
    int32 volume = 5;
    uint64 priority = 6;
  }
}

